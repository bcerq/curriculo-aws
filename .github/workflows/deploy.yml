name: Deploy Lambda Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Atualizar lambda de escrita
        run: |
          cd backend
          cp dynamodbwrite.py lambda_function.py
          zip function.zip lambda_function.py
          aws lambda update-function-code --function-name AcrescimoContador --zip-file fileb://function.zip
        
      - name: Atualizar lambda de leitura
        run: |
          cd backend
          cp dynamodbread.py lambda_function.py
          zip function.zip lambda_function.py
          aws lambda update-function-code --function-name consultaContador --zip-file fileb://function.zip